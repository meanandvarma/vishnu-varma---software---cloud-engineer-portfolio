services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vishnu-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}

  nginx:
    image: nginx:1.27-alpine
    container_name: vishnu-portfolio-nginx
    restart: unless-stopped
    depends_on:
      - portfolio
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
